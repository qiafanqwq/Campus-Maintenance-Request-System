server:
  port: 8080

spring:
  datasource:
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/cmrs?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: root
      password: a550146789

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.cmrs.entity,com.cmrs.vo
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      cmrs:
        mapper: debug
        service: info
        controller: info

knife4j: # knife4j的增强配置，不需要增强可以不配
  enable: true    # 开启knife4j,无需添加@EnableKnife4j注解
  setting:
    language: zh_cn   #中文
    swagger-model-name: 实体列表   #默认为: Swagger Models

cmrs:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    user-secret-key: cmrs-super-secure-jwt-key-2025-for-production-use-256bits
    # 设置jwt过期时间 (2小时)
    user-ttl: 7200000
    # 设置前端传递过来的令牌名称
    user-token-name: token
